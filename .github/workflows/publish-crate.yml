name: Publish crate

# Manual. Publishes the version in Cargo.toml to crates.io, with the board built first so the
# package carries face/dist. Needs the secret CARGO_REGISTRY_TOKEN in the "crates-io" environment.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to publish (the released code, not main)
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 30
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build the board
        working-directory: face
        run: |
          npm ci
          npm run build
      - run: rustup toolchain install stable --profile minimal
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # The first publish of a crate needs a token; switch to trusted publishing after that.
        # --allow-dirty: face/dist is built above and shipped in the package, but never committed.
        run: cargo publish --locked --allow-dirty # zizmor: ignore[use-trusted-publishing]
