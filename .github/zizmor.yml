# zizmor config. release.yml is generated by dist (`dist generate`); hand-editing it would be
# overwritten on the next dist upgrade, so the findings that come from dist's own template are
# ignored for that one file. Everything else is checked in full.
rules:
  template-injection:
    ignore:
      - release.yml
  unpinned-images:
    ignore:
      - release.yml
  excessive-permissions:
    ignore:
      - release.yml
