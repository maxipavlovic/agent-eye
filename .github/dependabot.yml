version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]

  # The board and the site share one package.json.
  - package-ecosystem: npm
    directory: /face
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    # release.yml is generated by dist, and dist rejects a hand-edited copy. These three are
    # used only there: bump them in dist-workspace.toml ([dist.github-action-commits]) and run
    # `dist generate`.
    ignore:
      - dependency-name: actions/upload-artifact
      - dependency-name: actions/download-artifact
      - dependency-name: actions/attest
