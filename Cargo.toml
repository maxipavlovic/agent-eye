[package]
name = "agent-eye"
version = "0.2.1"
edition = "2021"
rust-version = "1.89"
description = "Find, sort and resume your coding-agent sessions: local index, terminal picker and board"
license = "MIT"
repository = "https://github.com/maxipavlovic/agent-eye"
homepage = "https://maxipavlovic.github.io/agent-eye/"
readme = "README.md"
keywords = ["coding-agent", "claude-code", "sessions", "search", "tui"]
categories = ["command-line-utilities", "development-tools"]
# face/dist is the built board and is not committed, so it is listed here. Build it first
# (`npm ci && npm run build` in face/); `cargo package` and `cargo publish` then ship it and
# `cargo install` embeds the board without node. Without it the binary still works and `/`
# says the board was not built in.
include = [
    "/src/",
    "/tests/",
    "/skill/",
    "/face/dist/",
    "/build.rs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/licenses/",
]

[lib]
name = "agent_eye"
path = "src/lib.rs"

[[bin]]
name = "agent-eye"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json", "query"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
zstd = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
nucleo-matcher = "0.3.1"
unicode-width = "0.2"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
