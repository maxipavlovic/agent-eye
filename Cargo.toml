[package]
name = "agent-eye"
version = "0.5.0-rc.1"
edition = "2021"
rust-version = "1.89"
description = "Find, sort, resume and finish your coding-agent sessions, even overnight: local index, terminal picker and board"
license = "MIT"
repository = "https://github.com/maxipavlovic/agent-eye"
homepage = "https://maxipavlovic.github.io/agent-eye/"
readme = "README.md"
keywords = ["coding-agent", "claude-code", "sessions", "search", "tui"]
categories = ["command-line-utilities", "development-tools"]
# face/dist is the built board and is not committed, so it is listed here. Build it first
# (`npm ci && npm run build` in face/); `cargo package` and `cargo publish` then ship it and
# `cargo install` embeds the board without node. Without it the binary still works and `/`
# says the board was not built in.
include = [
    "/src/",
    "/tests/",
    "/skill/",
    "/face/dist/",
    "/build.rs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/licenses/",
]

[lib]
name = "agent_eye"
path = "src/lib.rs"

[[bin]]
name = "agent-eye"
path = "src/main.rs"

[features]
# For the end-to-end suite only (`e2e/`): `EYE_FIXED_NOW_MS` replaces the clock, so ages, due
# reminders and usage windows come out the same on every run. Never enabled in a release.
fixed-clock = []

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
jiff = { version = "1.0", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
regex = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
zstd = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1.2"
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
nucleo-matcher = "0.3.1"
unicode-width = "0.2"
tar = { version = "0.4.46", default-features = false }
sha2 = "0.11"

[dev-dependencies]
# tests name Europe/Madrid, and a bare Linux image has no tz database
jiff = { version = "1.0", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
