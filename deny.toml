# cargo-deny: `cargo deny check`. Runs in CI (see .github/workflows/ci.yml).

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]

[advisories]
# A security advisory or a yanked crate fails the check; an unmaintained crate only warns.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Licenses the dependency tree may use. Anything else fails the check.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate bloat the binary; worth knowing about, not worth failing for.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
