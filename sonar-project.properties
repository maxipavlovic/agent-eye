# SonarQube Cloud. CI runs the scan (.github/workflows/ci.yml) when the SONAR_TOKEN secret is set.
sonar.projectKey=maxipavlovic_agent-eye
sonar.organization=maxipavlovic
sonar.projectName=agent-eye
sonar.sourceEncoding=UTF-8

# Rust engine, the TypeScript board and the site. Face tests sit next to their code
# (face/src/**/*.test.ts), so face/src is also a test folder. The site is a static page generator
# without tests; it is analysed but left out of coverage.
sonar.sources=src,face/src,site/src,site/plugin,build.rs
sonar.tests=tests,face/src
sonar.test.inclusions=tests/**,**/*.test.ts,**/*.test.tsx

sonar.exclusions=**/node_modules/**,target/**,face/dist/**,face/dist-looks/**,face/coverage/**,face/fixtures/**,face/shots/**,tests/fixtures/**,site/dist/**,assets/**,**/*.min.js,\
  .github/workflows/release.yml,.github/build-setup.yml,\
  face/tools/**,scripts/*.mjs
# Not hand-written: release.yml and build-setup.yml are generated by cargo-dist (dist-workspace.toml)
# and rewritten on every `dist generate`, so findings there cannot be fixed in the repository.
# Developer tools run by hand on the developer's own machine (screenshots over a local Chrome
# DevTools port, demo media with ffmpeg, demo home folders, asset generation). Their paths and
# arguments come from the person running them, they ship in no package, and the "faulty
# LLM-supplied CLI arguments" findings (S8705/S8707/S8480/S4036) do not apply to them.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,tests/**,face/tools/**,face/vite*.config.ts,site/**

# Reports written by CI before the scan.
sonar.rust.lcov.reportPaths=lcov.info
sonar.rust.clippy.reportPaths=clippy-report.json
sonar.javascript.lcov.reportPaths=face/coverage/lcov.info
